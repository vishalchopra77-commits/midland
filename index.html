function lockTracker(){clearTimeout(lockTimer);sessionStorage.removeItem(SESSION);document.getElementById('tracker').srcdoc='';document.getElementById('app').hidden=true;document.getElementById('gate').hidden=false;document.getElementById('password').focus();document.title='Property tracker · Unlock'}
async function openTracker(key,expires){if(expires<=Date.now())throw Error('expired');const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(bundle.iv)},key,decode(bundle.data));document.getElementById('tracker').srcdoc=new TextDecoder().decode(plain);document.getElementById('password').value='';document.getElementById('gate').hidden=true;document.getElementById('app').hidden=false;document.title='Property tracker';clearTimeout(lockTimer);lockTimer=setTimeout(lockTracker,Math.max(0,expires-Date.now()));}
document.getElementById('unlockForm').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('unlock'),field=document.getElementById('password'),error=document.getElementById('error');button.disabled=true;button.textContent='Unlocking…';error.textContent='';try{if(!crypto.subtle)throw new Error('secure');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(bundle.salt),iterations:bundle.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},true,['decrypt']);const expires=Date.now()+HOUR;await openTracker(key,expires);try{const raw=await crypto.subtle.exportKey('raw',key);sessionStorage.setItem(SESSION,JSON.stringify({key:btoa(String.fromCharCode(...new Uint8Array(raw))),expires,salt:bundle.salt}));}catch{}}catch(err){error.textContent=err.message==='secure'?'Open this page over HTTPS or localhost.':'That password did not unlock the tracker. Please try again.'}finally{button.disabled=false;button.textContent='Unlock tracker'}};
